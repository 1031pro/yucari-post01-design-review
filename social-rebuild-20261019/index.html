<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゆ〜かり整骨院｜動画確認用 v04</title><style>*{box-sizing:border-box}body{margin:0;background:#fafaf7;color:#1e302b;font:16px/1.65 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:40px 24px 70px}header{margin-bottom:32px}h1{font-size:30px;margin:8px 0}h2{font-size:18px;line-height:1.5;min-height:54px;margin:6px 0 14px}.eyebrow{font-size:13px;letter-spacing:.1em;color:#576e64}p{margin:6px 0;color:#576e64}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}video{display:block;width:100%;aspect-ratio:9/16;background:#111}.buttons{display:flex;gap:8px;margin:14px 0}button{font:inherit;font-size:13px;flex:1;padding:10px 8px;border:1px solid #748b80;border-radius:5px;color:#1b4736;background:white;cursor:pointer}button[data-action=sound]{background:#22563f;color:white}a{color:#22563f;font-size:14px}details{border-top:1px solid #c9d3cc;margin-top:44px;padding-top:22px}summary{cursor:pointer;font-size:18px;margin-bottom:22px}details .grid{grid-template-columns:repeat(2,minmax(0,350px))}@media(max-width:760px){.grid,details .grid{grid-template-columns:1fr;max-width:420px;margin:auto}article{margin-bottom:30px}main{padding:24px 16px}h2{min-height:0}} </style><main><header><div class="eyebrow">ゆ〜かり整骨院 / 確認用 v04</div><h1>動画の確認</h1><p>再生は手動です。音声を聞く場合は「音声付きで再生」を押してください。</p></header><div class="grid"><article><div class="eyebrow">post01</div><h2>技術は、手技だけじゃない。</h2><video muted controls playsinline preload="none" poster="post01_closing_lipsync_v04.jpg" src="post01_closing_lipsync_v04.mp4"></video><div class="buttons"><button data-action="silent">消音で再生</button><button data-action="sound">音声付きで再生</button></div><a download href="post01_closing_lipsync_v04.mp4">動画をダウンロード ↓</a></article><article><div class="eyebrow">post05</div><h2>練習や研修は、いつやるの？</h2><video muted controls playsinline preload="none" poster="post05_narration_v04.jpg" src="post05_narration_v04.mp4"></video><div class="buttons"><button data-action="silent">消音で再生</button><button data-action="sound">音声付きで再生</button></div><a download href="post05_narration_v04.mp4">動画をダウンロード ↓</a></article><article><div class="eyebrow">post08</div><h2>わからないとき、相談できる？</h2><video muted controls playsinline preload="none" poster="post08_narration_v04.jpg" src="post08_narration_v04.mp4"></video><div class="buttons"><button data-action="silent">消音で再生</button><button data-action="sound">音声付きで再生</button></div><a download href="post08_narration_v04.mp4">動画をダウンロード ↓</a></article></div><details><summary>post05・post08：最後の1文を語るパターン</summary><div class="grid"><article><div class="eyebrow">post05</div><h2>練習や研修は、いつやるの？</h2><video muted controls playsinline preload="none" poster="post05_closing_lipsync_v04.jpg" src="post05_closing_lipsync_v04.mp4"></video><div class="buttons"><button data-action="silent">消音で再生</button><button data-action="sound">音声付きで再生</button></div><a download href="post05_closing_lipsync_v04.mp4">動画をダウンロード ↓</a></article><article><div class="eyebrow">post08</div><h2>わからないとき、相談できる？</h2><video muted controls playsinline preload="none" poster="post08_closing_lipsync_v04.jpg" src="post08_closing_lipsync_v04.mp4"></video><div class="buttons"><button data-action="silent">消音で再生</button><button data-action="sound">音声付きで再生</button></div><a download href="post08_closing_lipsync_v04.mp4">動画をダウンロード ↓</a></article></div></details></main><script>const all=[...document.querySelectorAll('video')];document.querySelectorAll('article').forEach(c=>{const v=c.querySelector('video');c.querySelectorAll('button').forEach(b=>b.onclick=()=>{all.forEach(x=>{if(x!==v)x.pause()});v.muted=b.dataset.action==='silent';v.play()})});document.addEventListener('visibilitychange',()=>{if(document.hidden)all.forEach(v=>v.pause())});</script></html>
