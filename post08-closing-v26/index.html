<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>post08 締め3候補</title><style>body{margin:0;background:#f5f5f2;color:#18372b;font:16px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:26px}button{font:inherit;cursor:pointer;padding:10px 18px;border:1px solid #567769;background:white;border-radius:8px;margin:4px}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{min-width:0}video{display:block;width:100%;aspect-ratio:9/16;background:#111;border-radius:5px}h2{font-size:20px}a{color:inherit}@media(max-width:600px){main{padding:14px}section{gap:8px}h2{font-size:16px}button{padding:8px;font-size:14px}}</style><main><h1>post08｜締め3候補</h1><p>同じ音声・同じ構図で、口の動きと表情を比較できます。再生ボタンを押すまで音は流れません。</p><p><button id="all">3本を同時に再生</button><button id="stop">すべて停止</button></p><section><article><h2>候補1</h2><video controls playsinline preload="metadata" poster="poster_1.jpg" src="post08_closing_candidate_1.mp4"></video><p><a href="post08_closing_candidate_1.mp4" download>動画を保存</a></p></article><article><h2>候補2</h2><video controls playsinline preload="metadata" poster="poster_2.jpg" src="post08_closing_candidate_2.mp4"></video><p><a href="post08_closing_candidate_2.mp4" download>動画を保存</a></p></article><article><h2>候補3</h2><video controls playsinline preload="metadata" poster="poster_3.jpg" src="post08_closing_candidate_3.mp4"></video><p><a href="post08_closing_candidate_3.mp4" download>動画を保存</a></p></article></section><p><a href="../social-rebuild-20261019/?v=25">全編の確認ページへ</a></p></main><script>const vs=[...document.querySelectorAll('video')];let together=false;function stop(){vs.forEach(v=>v.pause());together=false}document.querySelector('#stop').onclick=stop;document.querySelector('#all').onclick=async()=>{stop();together=true;vs.forEach((v,i)=>{v.currentTime=0;v.muted=i!==0});try{await Promise.all(vs.map(v=>v.play()))}catch(e){stop()}};vs.forEach(v=>{v.addEventListener('play',()=>{if(!together){vs.forEach(o=>{if(o!==v)o.pause()});v.muted=false}});v.addEventListener('ended',()=>{if(vs.every(o=>o.ended))together=false})});</script></html>
