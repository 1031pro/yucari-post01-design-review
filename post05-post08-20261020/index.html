<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>post01・05・08｜動画確認</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#203c31;font-family:system-ui,"Yu Gothic",sans-serif;line-height:1.7}main{max-width:1180px;margin:auto;padding:28px 20px 48px}h1{font-size:27px;margin:0 0 10px}header p{margin:6px 0}.date{font-size:14px;color:#617166}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:26px}article{background:#fff;border:1px solid #dde5dc;border-radius:10px;padding:16px;min-width:0}h2{font-size:19px;margin:0 0 4px}.subtitle{font-size:14px;color:#57685d;margin:0 0 12px}video{display:block;width:100%;aspect-ratio:9/16;background:#101613;object-fit:contain}.buttons{display:flex;gap:8px;margin-top:12px}button{font:inherit;font-size:14px;flex:1;cursor:pointer;border:1px solid #b7c7ba;border-radius:6px;background:#fff;color:#244f37;padding:10px 6px}button[data-mode=sound]{background:#245139;color:white;border-color:#245139}button:focus-visible{outline:3px solid #e6b941;outline-offset:3px}.status{font-size:13px;color:#754c20;min-height:1.5em;margin:8px 0 0}@media(max-width:780px){main{padding:22px 16px}.grid{grid-template-columns:1fr}article{width:100%;max-width:420px;margin:auto}h1{font-size:23px}}</style></head><body><main><header><p class="date">2026年10月21日 更新</p><h1>post01・05・08 動画確認</h1><p>「音声付きで再生」を押すと音声が流れます。ページを開いただけでは再生されません。</p><p class="date">確認用：Instagram版3本</p></header><section class="grid" aria-label="確認用動画"><article aria-labelledby="post01-title"><h2 id="post01-title">post01</h2><p class="subtitle">技術の考え方</p><video id="post01" controls muted playsinline preload="none" poster="../social-rebuild-20261019/review-v11-20261021/post01_a205daa29370.jpg" src="../social-rebuild-20261019/review-v11-20261021/post01_instagram_a205daa29370.mp4"></video><div class="buttons"><button type="button" data-mode="silent" aria-label="post01を消音で再生">消音で再生</button><button type="button" data-mode="sound" aria-label="post01を音声付きで再生">音声付きで再生</button></div><p class="status" role="status" aria-live="polite"></p></article><article aria-labelledby="post05-title"><h2 id="post05-title">post05</h2><p class="subtitle">外傷アカデミー</p><video id="post05" controls muted playsinline preload="none" poster="../social-rebuild-20261019/review-v11-20261021/post05_fc57bcf69f42.jpg" src="../social-rebuild-20261019/review-v11-20261021/post05_instagram_fc57bcf69f42.mp4"></video><div class="buttons"><button type="button" data-mode="silent" aria-label="post05を消音で再生">消音で再生</button><button type="button" data-mode="sound" aria-label="post05を音声付きで再生">音声付きで再生</button></div><p class="status" role="status" aria-live="polite"></p></article><article aria-labelledby="post08-title"><h2 id="post08-title">post08</h2><p class="subtitle">相談できる環境</p><video id="post08" controls muted playsinline preload="none" poster="../social-rebuild-20261019/review-v11-20261021/post08_2c74e10ff249.jpg" src="../social-rebuild-20261019/review-v11-20261021/post08_instagram_2c74e10ff249.mp4"></video><div class="buttons"><button type="button" data-mode="silent" aria-label="post08を消音で再生">消音で再生</button><button type="button" data-mode="sound" aria-label="post08を音声付きで再生">音声付きで再生</button></div><p class="status" role="status" aria-live="polite"></p></article></section></main><script>const videos=Array.from(document.querySelectorAll('video'));function pauseAll(){videos.forEach(v=>v.pause())}document.querySelectorAll('article').forEach(card=>{const v=card.querySelector('video');const status=card.querySelector('.status');card.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{pauseAll();v.muted=button.dataset.mode!=='sound';v.volume=1;status.textContent='';const promise=v.play();if(promise)promise.catch(()=>{status.textContent='再生ボタンから動画を再生してください。'})}));v.addEventListener('play',()=>videos.forEach(other=>{if(other!==v)other.pause()}))});document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAll()});window.addEventListener('pagehide',pauseAll);</script></body></html>
