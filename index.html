<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大船ゆ〜かり整骨院｜動画デザイン比較</title>
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0;background:#f6f7f2;color:#163d32;font-family:system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:32px 24px}h1{font-size:26px}p{line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}article{background:white;padding:18px;border:1px solid #dde3d8;border-radius:12px}h2{font-size:19px;margin:0 0 8px}video{display:block;width:100%;aspect-ratio:9/16;background:#eee;object-fit:contain}button{margin:12px 4px 0 0;padding:10px 12px;border:0;border-radius:5px;background:#163d32;color:white;cursor:pointer}button.sound{background:#e5ebdf;color:#163d32}a{color:#163d32;font-size:14px;display:block;margin-top:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}article{max-width:430px;margin:auto}}</style>
<main><h1>post01 · デザイン比較</h1><p>3案とも27秒。同じ映像構成とナレーションです。自動再生はありません。再生は消音で始まります。</p><div class="grid">
<article><h2>A · タイポグラフィ</h2><p>クリーム地と太いゴシック。</p><video controls muted playsinline preload="none" poster="post01_Ver0.2_poster.jpg" src="post01_Ver0.2.mp4"></video><button class="play">消音で再生</button><button class="sound">音声を有効にする</button><a href="post01_Ver0.2.mp4" download>MP4を保存</a></article>
<article><h2>B · フルスクリーン</h2><p>大きな人物映像、白文字とライム色。</p><video controls muted playsinline preload="none" poster="post01_Ver0.2_DesignB_poster.jpg" src="post01_Ver0.2_DesignB.mp4"></video><button class="play">消音で再生</button><button class="sound">音声を有効にする</button><a href="post01_Ver0.2_DesignB.mp4" download>MP4を保存</a></article>
<article><h2>C · エディトリアル</h2><p>明朝体と白い余白、深緑のアクセント。</p><video controls muted playsinline preload="none" poster="post01_Ver0.2_DesignC_poster.jpg" src="post01_Ver0.2_DesignC.mp4"></video><button class="play">消音で再生</button><button class="sound">音声を有効にする</button><a href="post01_Ver0.2_DesignC.mp4" download>MP4を保存</a></article>
</div></main><script>
const videos=[...document.querySelectorAll('video')];videos.forEach(v=>v.muted=true);
document.querySelectorAll('article').forEach(card=>{const v=card.querySelector('video'),sound=card.querySelector('.sound');card.querySelector('.play').onclick=()=>{videos.forEach(other=>{other.pause();other.muted=true});document.querySelectorAll('.sound').forEach(b=>b.textContent='音声を有効にする');v.currentTime=0;v.play()};sound.onclick=()=>{v.muted=!v.muted;sound.textContent=v.muted?'音声を有効にする':'消音にする'};v.addEventListener('play',()=>videos.filter(other=>other!==v).forEach(other=>{other.pause();other.muted=true}))});
document.addEventListener('visibilitychange',()=>{if(document.hidden){videos.forEach(v=>{v.pause();v.muted=true});document.querySelectorAll('.sound').forEach(b=>b.textContent='音声を有効にする')}});
</script></html>
